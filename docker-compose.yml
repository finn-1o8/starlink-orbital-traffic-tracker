# Local development stack. Copy .env.example to .env first and set POSTGRES_PASSWORD.
# Database and cache ports are bound to localhost only.

services:
  postgres:
    image: postgres:16-alpine
    container_name: orbital-postgres
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-orbital_tracker}
      POSTGRES_USER: ${POSTGRES_USER:-orbital_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-orbital_user} -d ${POSTGRES_DB:-orbital_tracker}"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: orbital-redis
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - redis_data:/data
    command: redis-server --appendonly yes
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5

  backend:
    build: ./backend
    container_name: orbital-backend
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-orbital_user}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-orbital_tracker}
      REDIS_URL: redis://redis:6379/0
      CORS_ORIGINS: http://localhost:3000,http://localhost:3001,http://localhost:5173
      TLE_UPDATE_INTERVAL_HOURS: 6
      WS_UPDATE_SECONDS: ${WS_UPDATE_SECONDS:-5}
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile.dev
    container_name: orbital-frontend
    environment:
      VITE_API_URL: http://localhost:8000/api
      VITE_WS_URL: ws://localhost:8000/api
      VITE_CESIUM_ION_TOKEN: ${CESIUM_ION_TOKEN:-}
    ports:
      - "3001:3000"
    depends_on:
      - backend
    volumes:
      - ./frontend:/app
      - /app/node_modules

volumes:
  postgres_data:
  redis_data:
