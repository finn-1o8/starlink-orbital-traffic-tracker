# Serves the Vite build. The app is built with base "/tracker/" and the reverse proxy strips
# that prefix, so requests arrive as "/assets/..." and "/cesium/...".
server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml image/svg+xml;

    # vite-plugin-cesium copies the Cesium static files under the base path.
    location ~ ^/cesium(/.*)?$ {
        alias /usr/share/nginx/html/tracker/cesium$1;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
